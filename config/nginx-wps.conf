# WPS integration for nginx: put it into the server { } block of the CRM, before the location blocks, and reload nginx.
# nginx appends the original query string to a replacement that contains "?", so filter[...]=... and size are kept.
# SuiteCRM 8: DocumentRoot is public/, the legacy layer is served as /legacy. The rule must be in the vhost
# (not in public/.htaccess): there it would come after the Symfony front controller rewrite.
# Not tested by the package author (the reference stand uses Apache); check with the curl from README → Check.

    rewrite ^/api/v9/(.*)$ /legacy/index.php?entryPoint=wpsApi&wps_path=$1 last;
