# WPS integration: /api/v9/{module}[/{id}] → wpsApi entry point of the package (query string is kept).
# Put it inside the <VirtualHost> of the CRM and reload Apache (mod_rewrite must be enabled: a2enmod rewrite).
# bin/install.sh --apache-conf <vhost file> adds exactly this block.
# SuiteCRM 8: DocumentRoot is public/, the legacy layer is served as /legacy. The rule must be in the vhost
# (not in public/.htaccess): there it would come after the Symfony front controller rewrite.
# If the CRM lives in a sub-path (e.g. /crm), prefix both sides: ^/crm/api/v9/(.*)$ /crm/legacy/index.php…

    # BEGIN WPS integration: /api/v9/{module}[/{id}] -> wpsApi entry point (query string is kept)
    RewriteEngine On
    RewriteRule ^/api/v9/(.*)$ /legacy/index.php?entryPoint=wpsApi&wps_path=$1 [QSA,PT,L]
    # END WPS integration
